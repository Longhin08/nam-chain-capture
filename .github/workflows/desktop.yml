name: Desktop app

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["poc/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest   # Apple Silicon (o PyTorch não tem mais build para Mac Intel)
            name: macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poc/requirements*.txt

      - name: Install PyTorch (CPU / MPS)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu torch
          else
            pip install torch
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-desktop.txt

      - name: Tests
        run: python -m pytest -q

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(python -c 'from app.version import VERSION; print(VERSION)')"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/nam_chain_capture.spec --noconfirm --log-level WARN

      - name: Self-test of the packaged app
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE="dist/NAM Chain Capture/NAM Chain Capture.exe"
          else
            EXE="dist/NAM Chain Capture.app/Contents/MacOS/NAM Chain Capture"
          fi
          export CHAINCAP_WORKSPACE="$RUNNER_TEMP/ws"
          "$EXE" --self-test > selftest.log 2>&1 || true
          cat selftest.log
          grep -q "SELF-TEST OK" selftest.log

      - name: Build portable version (no own .exe)
        if: runner.os == 'Windows'
        run: |
          python packaging/make_portable.py --version "${{ steps.v.outputs.version }}" | tee portable.log
          echo "PORTABLE_ROOT=$(grep '^PORTABLE_ROOT=' portable.log | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: Check portable signatures (only signed Python executables)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = $env:PORTABLE_ROOT
          foreach ($f in @("python\python.exe", "python\pythonw.exe")) {
            $sig = Get-AuthenticodeSignature (Join-Path $root $f)
            Write-Host "$f -> $($sig.Status) / $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "$f não está assinado" }
          }
          $own = Get-ChildItem $root -Recurse -Filter *.exe | Where-Object { $_.FullName -notlike "*\python\*" }
          if ($own) { $own | ForEach-Object { Write-Host "exe fora do Python: $($_.FullName)" }; throw "há .exe além do python.exe/pythonw.exe oficiais" }

      - name: Self-test of the portable version
        if: runner.os == 'Windows'
        run: |
          export CHAINCAP_WORKSPACE="$RUNNER_TEMP/ws-portable"
          "$PORTABLE_ROOT/python/python.exe" "$PORTABLE_ROOT/app/desktop_main.py" --self-test > selftest-portable.log 2>&1 || true
          cat selftest-portable.log
          grep -q "SELF-TEST OK" selftest-portable.log

      - name: Portable shortcuts and app window (Edge)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = $env:PORTABLE_ROOT
          $py = Join-Path $root "python\python.exe"
          $env:CHAINCAP_WORKSPACE = Join-Path $env:RUNNER_TEMP "ws-shortcuts"
          $env:CHAINCAP_SHORTCUT_DIRS = (Join-Path $env:RUNNER_TEMP "menu") + "|" + (Join-Path $env:RUNNER_TEMP "desktop")
          & $py (Join-Path $root "app\desktop_main.py") --make-shortcuts
          if ($LASTEXITCODE -ne 0) { throw "falhou ao criar atalhos" }
          $shell = New-Object -ComObject WScript.Shell
          foreach ($d in $env:CHAINCAP_SHORTCUT_DIRS.Split('|')) {
            $lnk = $shell.CreateShortcut((Join-Path $d "NAM Chain Capture.lnk"))
            Write-Host "$d -> $($lnk.TargetPath) $($lnk.Arguments) | ícone: $($lnk.IconLocation)"
            # (o Windows pode mostrar a mesma pasta com nome curto 8.3 ou longo)
            if (-not (Test-Path $lnk.TargetPath) -or $lnk.TargetPath -notlike "*\NAM Chain Capture\python\pythonw.exe") { throw "atalho não aponta para o pythonw.exe do pacote" }
            if (-not (Test-Path ($lnk.IconLocation -replace ',\d+$',''))) { throw "ícone não encontrado" }
          }
          $edge = & $py -c "import desktop_main as d; print(d.find_edge() or '')"
          Write-Host "Edge: $edge"
          if (-not $edge) { throw "msedge.exe não encontrado" }

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup --no-progress -y
          "$ISCC" "//DAppVersion=${{ steps.v.outputs.version }}" packaging/windows.iss

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          APP="dist/NAM Chain Capture.app"
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "NAM Chain Capture" -srcfolder dmg -ov -format UDZO \
            "dist/NAM-Chain-Capture-${{ steps.v.outputs.version }}-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: NAM-Chain-Capture-${{ matrix.name }}
          path: |
            poc/dist/*.exe
            poc/dist/*.dmg
            poc/dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: true
